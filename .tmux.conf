# --------- general
set  -g  default-terminal   "tmux-256color"
set  -g  mouse              on
set  -g  history-limit      10000
set  -sg escape-time        10

set  -g  base-index         1
setw -g  pane-base-index    1
set  -g  renumber-windows   on


# --------- decorations
set -g @sep_r   ""
set -g @sep_l   ""
set -g @diag    "|"

set -g @mode    "#{?client_prefix,brightmagenta,#{?pane_in_mode,cyan,green}}"


# --------- status bar
set -g status-position      bottom
set -g status-interval      1
set -g status-style         "bg=black,fg=white"


# --------- status - left
set -g @sl_host   "#[bg=#{E:@mode},fg=black,bold] #H "
set -g @sl_user   "#[fg=#{E:@mode},bg=brightblack,nobold]#{@sep_r}#[fg=brightwhite] #{client_user} "
set -g @sl_wins   "#[fg=brightblack,bg=black]#{@sep_r} #{W:#{E:@win},#{E:@win_cur}}"

set -g status-left-length   120
set -g status-left          "#{E:@sl_host}#{E:@sl_user}#{E:@sl_wins}"


# --------- stats
set -goq @cpu    0
set -goq @freq   0
set -goq @temp   0
set -goq @ram    "0/0M"

run-shell -b '
  old=$(tmux show -gqv @stats_pid)
  [ -n "$old" ] && kill "$old" 2>/dev/null
  tmux set -g @stats_pid $$

  zone=/dev/null
  for h in /sys/class/hwmon/hwmon*; do
    case "$(cat "$h/name")" in
      coretemp|k10temp|zenpower|cpu_thermal) zone="$h/temp1_input"; break ;;
    esac
  done
  if [ "$zone" = /dev/null ]; then
    for z in /sys/class/thermal/thermal_zone*; do
      case "$(cat "$z/type")" in
        x86_pkg_temp|cpu-thermal) zone="$z/temp"; break ;;
      esac
    done
  fi
  fq=/sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq

  read -r _ u n s i w q sq st _ < /proc/stat
  pt=$((u+n+s+i+w+q+sq+st))
  pi=$((i+w))

  while sleep 1; do
    read -r _ u n s i w q sq st _ < /proc/stat
    t=$((u+n+s+i+w+q+sq+st))
    id=$((i+w))
    dt=$((t-pt))
    di=$((id-pi))
    pt=$t
    pi=$id

    cpu=0
    [ "$dt" -gt 0 ] && cpu=$(( (100*(dt-di) + dt/2) / dt ))
    freq=$(( $(cat "$fq") / 1000 ))
    temp=$(( $(cat "$zone" 2>/dev/null || echo 0) / 1000 ))

    while read -r k v _; do
      case $k in
        MemTotal:)     mt=$v ;;
        MemAvailable:) ma=$v ;;
      esac
    done < /proc/meminfo
    ram="$(( (mt-ma) / 1024 ))/$(( mt / 1024 ))M"

    tmux set -g @cpu  "$cpu"  \; \
         set -g @freq "$freq" \; \
         set -g @temp "$temp" \; \
         set -g @ram  "$ram"  || exit 0
  done
'


# --------- status - right
set -g @thin      "#[fg=brightblack]#{@diag}#[fg=white]"
set -g @temp_fg   "#{?#{e|>=:#{@temp},75},#[fg=brightred bold],#{?#{e|>=:#{@temp},65},#[fg=brightmagenta bold],#[fg=white]}}"

set -g @sr_cpu    "#[bg=black,fg=white] CPU #{p-3:@cpu}%% #{E:@thin} #{p-4:@freq}MHz #{E:@thin} #{E:@temp_fg}#{p-3:@temp}°C#[fg=white,nobold] "
set -g @sr_ram    "#[fg=brightblack,bg=black]#{@sep_l}#[bg=brightblack,fg=brightwhite] RAM #{@ram} "
set -g @sr_date   "#[fg=#{E:@mode},bg=brightblack]#{@sep_l}#[bg=#{E:@mode},fg=black,nobold] %d.%m "
set -g @sr_time   "#{@diag}#[bold] %H:%M:%S "

set -g status-right-length  150
set -g status-right         "#{E:@sr_cpu}#{E:@sr_ram}#{E:@sr_date}#{E:@sr_time}"


# --------- window list
setw -g window-status-format           ""
setw -g window-status-current-format   ""
setw -g window-status-separator        ""

set -g @wl        "#{?window_start_flag,#[fg=brightblack][,}"
set -g @wr        "#{?window_end_flag, #[fg=brightblack]],}"

set -g @win       "#[range=window|#{window_index}]#{E:@wl}#[fg=white,nobold] #I#{E:@wr}#[norange]"
set -g @win_cur   "#[range=window|#{window_index}]#{E:@wl}#[fg=#{E:@mode},bold] #I#[nobold]#{E:@wr}#[norange]"


# --------- messages - modes - borders
set  -g message-style              "bg=brightblack,fg=brightwhite"
set  -g message-command-style      "bg=brightblack,fg=brightwhite"
setw -g mode-style                 "bg=cyan,fg=black"
set  -g pane-border-style          "fg=brightblack"
set  -g pane-active-border-style   "fg=green"


# --------- keys
bind r source-file ~/.tmux.conf \; display "Config reloaded"
